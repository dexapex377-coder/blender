name: assemble-android-apk-only

# Rebuild just the APK from a previously built `gradle-stage` artifact
# (which already contains the prebuilt libblender.so + runtime assets) and the
# current app sources on the `android` branch. Use this to iterate on the app
# (Java/Kotlin/Manifest/resources) without recompiling C++/ninja:
#
#   gh workflow run assemble-android-apk-only.yml --repo dexapex377-coder/blender \
#     -f stage_artifact_run=<run-id-of-a-completed-build>
#
# Inputs:
#   stage_artifact_run  Run ID of a completed workflow whose `gradle-stage`
#                       artifact should be reused. Get it from `gh run list`.

on:
  workflow_dispatch:
    inputs:
      stage_artifact_run:
        description: Run ID of a completed workflow whose gradle-stage artifact to reuse
        type: string
        required: false
        default: ''

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      # Read the version out of the source instead of writing it into the workflow. This
      # passed -PblenderVersionName=5.3.0 Alpha literally, so the string the phone shows
      # was whatever the yml happened to say rather than what was built. It agreed with
      # the source by coincidence; the day the android branch moves to another version it
      # would be quietly wrong. The arithmetic mirrors platform_android_gradle.cmake:
      #   abi_prefix * 100000000 + major * 1000000 + minor * 10000 + patch * 100
      # so 5.3.0 alpha on arm64-v8a is 105030000, and versionCode only ever grows, which
      # matters when installing over an older build.
      - name: Derive the APK version from the source
        id: version
        run: |
          set -o pipefail
          H=$(find . -name BKE_blender_version.h -not -path '*/.git/*' 2>/dev/null | head -1)
          if [ -z "$H" ] || [ ! -f "$H" ]; then
            echo "::warning::BKE_blender_version.h is not in the artifact; leaving the"
            echo "::warning::version at the workflow's own value."
            exit 0
          fi
          VER=$(sed -n 's/^#define BLENDER_VERSION[[:space:]]\{1,\}\([0-9]*\).*/\1/p' "$H" | head -1)
          PATCH=$(sed -n 's/^#define BLENDER_VERSION_PATCH[[:space:]]\{1,\}\([0-9]*\).*/\1/p' "$H" | head -1)
          CYCLE=$(sed -n 's/^#define BLENDER_VERSION_CYCLE[[:space:]]\{1,\}\([A-Za-z]*\).*/\1/p' "$H" | head -1)
          if [ -z "$VER" ]; then
            echo "ERROR: could not parse BLENDER_VERSION out of $H"
            exit 1
          fi
          # BLENDER_VERSION is major*100 + minor (503 is 5.3), not the major on its own.
          # Reading it as the major gives "503.0.0 alpha" and a versionCode of 603000000.
          MAJOR=$(( VER / 100 ))
          MINOR=$(( VER % 100 ))
          [ -n "$PATCH" ] || PATCH=0
          [ -n "$CYCLE" ] || CYCLE=release
          NAME="$MAJOR.$MINOR.$PATCH $CYCLE"
          CODE=$(( 1 * 100000000 + MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 ))
          echo "read $H -> BLENDER_VERSION=$VER PATCH=$PATCH CYCLE=$CYCLE"
          echo "parsed as $MAJOR.$MINOR.$PATCH"
          echo "APK will report versionName='$NAME' versionCode=$CODE"
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Checkout android branch (app sources to overlay)
        uses: actions/checkout@v4
        with:
          ref: android
          # The repo has stray git-lfs pointers (assets/*.blend) that cannot be
          # smudged in the CI environment; the app overlay does not need them.
          lfs: false

      - name: Download staged Gradle project
        uses: actions/download-artifact@v4
        with:
          name: gradle-stage
          run-id: ${{ inputs.stage_artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and overlay app sources
        run: |
          set -o pipefail
          mkdir -p stage
          tar -I zstd -xf gradle-stage.tar.zst -C stage
          chmod +x stage/gradle/gradlew
          if [ -d release/android/app ]; then
            # Refresh the app sources from HEAD without touching the staged .so/assets.
            cp -rT release/android/app stage/gradle/app
            echo "App sources overlaid from release/android/app:"
            ls -la stage/gradle/app/src/main/java/org/blender/blender/
          else
            echo "release/android/app not present in this checkout, keeping staged sources"
          fi
          echo "--- app/build.gradle (overlaid) ---"
          head -20 stage/gradle/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle Wrapper distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('stage/gradle/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('stage/gradle/gradle/wrapper/gradle-wrapper.properties','stage/gradle/build.gradle','stage/gradle/settings.gradle','stage/gradle/gradle.properties','stage/gradle/app/build.gradle') }}

      - name: Assemble APK
        run: |
          set -o pipefail
          cd stage/gradle
          # app/build.gradle reads every one of these with project.property(), which THROWS
          # when the property is absent -- there is no default to fall back on. blenderAbi
          # was missing from this invocation, so the run died during configuration with
          #   Could not get unknown property 'blenderAbi' for project ':app'
          #   Build file '.../stage/gradle/app/build.gradle' line: 34
          # Upstream's own gradle_assemble target passes all four
          # (build_files/cmake/platform/platform_android_gradle.cmake, gradle_assemble):
          #   -PblenderVersionName -PblenderVersionCode -PblenderMinSdk -PblenderAbi
          # The ABI comes from the libraries in the staged artifact, not from a constant: this
          # workflow deliberately reuses a .so built by an earlier run, so the ABI is whatever
          # that run staged.
          ABI=$(find app/src/main/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | head -1)
          [ -n "$ABI" ] || ABI=arm64-v8a
          ARGS=(
            "-PblenderVersionName=${{ steps.version.outputs.version_name || '5.3.0 Alpha' }}"
            "-PblenderVersionCode=${{ steps.version.outputs.version_code || '105030000' }}"
            "-PblenderMinSdk=29"
            "-PblenderAbi=$ABI"
          )
          # Fail here, naming the property Gradle wanted, instead of inside its configuration phase.
          MISSING=""
          for p in $(grep -oE "project\.property\('[A-Za-z]+'\)" app/build.gradle \
                       | sed "s/.*'\(.*\)'.*/\1/" | sort -u); do
            found=0
            for a in "${ARGS[@]}"; do case "$a" in "-P$p="*) found=1 ;; esac; done
            [ "$found" = 1 ] || MISSING="$MISSING $p"
          done
          [ -z "$MISSING" ] || { echo "ERROR: app/build.gradle needs$MISSING but they were not passed"; exit 1; }
          echo "ABI: $ABI"
          printf 'Gradle args:'; printf ' %q' "${ARGS[@]}"; echo
          ./gradlew assembleRelease "${ARGS[@]}" 2>&1 | tee gradle.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find stage/gradle -name "app-release.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            stage/gradle/gradle.log