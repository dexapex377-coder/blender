name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (android branch, no LFS)
        id: checkout
        uses: actions/checkout@v4
        with:
          path: blender
          ref: android
          lfs: false

      - name: Download LFS files from parent repo
        run: |
          set -o pipefail
          cd blender
          PARENT=https://raw.githubusercontent.com/blender/blender/android
          for f in release/datafiles/startup.blend assets/brushes/essentials_brushes-curve_sculpt.blend; do
            curl -sL "$PARENT/$f" -o "$f"
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            IS_404=$(grep -q "404: Not Found" "$f" 2>/dev/null && echo "yes" || echo "no")
            if [ "$SIZE" -lt 1024 ] || [ "$IS_404" = "yes" ]; then
              echo "WARNING: $f inválido (size=$SIZE, 404=$IS_404) — usando dummy"
              rm -f "$f"
              python3 -c "sz=121384 if 'startup' in '$f' else 102400; open('$f','wb').write(b'BLENDER-v293' + b'\x00'*(sz-12))"
            fi
          done
          REMAINING=$(git status --short | wc -l)
          echo "Remaining files: $REMAINING"
          if [ "$REMAINING" -gt 2 ]; then
            echo "ERROR: more than 2 files remaining"
            git status --short
            exit 1
          fi

      - name: Clone precompiled libs
        run: |
          set -o pipefail
          git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git blender/lib/android_arm64
          cd blender/lib/android_arm64
          git lfs install
          git lfs pull

      - name: Verify zstd
        run: |
          set -o pipefail
          SIZE=$(stat -c%s blender/lib/android_arm64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "zstd.a size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: zstd is a LFS pointer"
            exit 1
          fi
          echo "zstd OK"

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install GCC 14 and system deps for host_tools
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 \
            libjpeg-dev libpng-dev zlib1g-dev libzstd-dev libepoxy-dev libfmt-dev \
            libfreetype6-dev libtiff-dev libwebp-dev libopenexr-dev libgl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools \
            libshaderc-dev \
            libopenimageio-dev openimageio-tools \
            libopencolorio-dev \
            libembree-dev \
            libeigen3-dev \
            libopenexr-dev \
            libimath-dev \
            libceres-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          gcc --version
          g++ --version

      - name: Verify OIIO and OCIO .cmake files
        run: |
          set -o pipefail
          echo "=== OpenImageIO .cmake files ==="
          find /usr -iname "*OpenImageIOConfig.cmake" -o -iname "*openimageio-config.cmake" 2>/dev/null
          dpkg -L libopenimageio-dev 2>/dev/null | grep -i cmake | head -5
          echo "=== iconvert binary ==="
          which iconvert 2>/dev/null || echo "iconvert NOT FOUND"
          ls -la /usr/bin/iconvert 2>/dev/null || echo "no iconvert at /usr/bin/iconvert"
          echo "=== OpenColorIO .cmake files ==="
          find /usr -iname "*OpenColorIOConfig.cmake" -o -iname "*opencolorio-config.cmake" 2>/dev/null
          dpkg -L libopencolorio-dev 2>/dev/null | grep -i cmake | head -5
          echo "=== shaderc .pc files ==="
          find /usr -iname "shaderc*.pc" 2>/dev/null | xargs -I{} sh -c 'echo "--- {} ---"; cat {}'
          echo "=== done ==="

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python 3.13
        run: |
          which python3 && python3 --version
          echo "Python path: $(which python3)"

      - name: Configure CMake (attempt 1)
        id: cmake-attempt1
        run: |
          set -o pipefail
          cd blender
          cmake -B build \
            -S . \
            -DCMAKE_TOOLCHAIN_FILE=build_files/cmake/platform/platform_android_toolchain.cmake \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -C build_files/cmake/config/blender_release.cmake \
            -DWITH_TESTS=OFF \
            -DWITH_PYTHON_INSTALL=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DTEST_PYTHON_EXE=$(which python3) \
            -DWITH_X11_XINPUT=OFF \
            -DWITH_GHOST_X11=OFF \
            -GNinja 2>&1 | tee cmake_config.log

      - name: Handle CMake failure
        if: steps.cmake-attempt1.outcome == 'failure'
        run: |
          set -o pipefail
          if grep -q "_LIBCPP_USING_IF_EXISTS\|incomplete type 'tm'" cmake_config.log 2>/dev/null; then
            echo "ctime/tm error detected — STOPPING for diagnosis"
            cat cmake_config.log
            exit 1
          else
            echo "CMake failed with different error"
            cat cmake_config.log
            exit 1
          fi

      - name: Build and stage Gradle
        if: steps.cmake-attempt1.outcome == 'success'
        env:
          CMAKE_PREFIX_PATH: /usr/share/cmake:/usr/lib/x86_64-linux-gnu/cmake
        run: |
          set -o pipefail
          echo "=== Fix broken OpenImageIO/ColorIO cmake configs ==="
          OIIO_CMAKE=/usr/lib/x86_64-linux-gnu/cmake/OpenImageIO/OpenImageIOConfig.cmake
          OCIO_CMAKE=/usr/share/cmake/OpenColorIOConfig.cmake
          if grep -q 'opencv4' "$OIIO_CMAKE" 2>/dev/null; then
            echo "Patching OpenImageIO cmake to remove opencv4 ref"
            sudo sed -i 's|/usr/include/opencv4||g; s|/usr/include/opencv4/| |g' "$OIIO_CMAKE"
            echo "OpenImageIO patched:"
            grep -n 'opencv' "$OIIO_CMAKE" 2>/dev/null || echo "  No opencv refs remaining"
          fi
          if grep -q '/include' "$OCIO_CMAKE" 2>/dev/null; then
            echo "Patching OpenColorIO cmake to fix relative include path"
            sudo sed -i 's|-I/include|-I/usr/include|g; s|-L/lib|-L/usr/lib/x86_64-linux-gnu|g' "$OCIO_CMAKE"
          fi
          cd blender
          cmake --build build --target install 2>&1 | tee build.log
          cmake --build build --target gradle_stage 2>&1 | tee gradle_stage.log

      - name: Assemble APK
        run: |
          set -o pipefail
          cd blender/build/gradle
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PblenderVersionName=5.2.0 \
            -PblenderVersionCode=5020000 \
            -PblenderMinSdk=29 2>&1 | tee gradle.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find blender/build/gradle -name "app-release.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: cmake_config*.log build.log gradle.log
          if-no-files-found: ignore

