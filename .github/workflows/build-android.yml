name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (android branch, no LFS)
        id: checkout
        uses: actions/checkout@v4
        with:
          path: blender
          ref: android
          lfs: false

      - name: Download LFS files from parent repo
        run: |
          set -o pipefail
          cd blender
          PARENT=https://raw.githubusercontent.com/blender/blender/android
          for f in release/datafiles/startup.blend assets/brushes/essentials_brushes-curve_sculpt.blend; do
            curl -sL "$PARENT/$f" -o "$f"
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            IS_404=$(grep -q "404: Not Found" "$f" 2>/dev/null && echo "yes" || echo "no")
            if [ "$SIZE" -lt 1024 ] || [ "$IS_404" = "yes" ]; then
              echo "WARNING: $f inválido (size=$SIZE, 404=$IS_404) — usando dummy"
              rm -f "$f"
              python3 -c "sz=121384 if 'startup' in '$f' else 102400; open('$f','wb').write(b'BLENDER-v293' + b'\x00'*(sz-12))"
            fi
          done
          REMAINING=$(git status --short | wc -l)
          echo "Remaining files: $REMAINING"
          if [ "$REMAINING" -gt 2 ]; then
            echo "ERROR: more than 2 files remaining"
            git status --short
            exit 1
          fi

      - name: Clone precompiled libs
        run: |
          set -o pipefail
          git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git blender/lib/android_arm64
          cd blender/lib/android_arm64
          git lfs install
          git lfs pull

      - name: Verify zstd
        run: |
          set -o pipefail
          SIZE=$(stat -c%s blender/lib/android_arm64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "zstd.a size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: zstd is a LFS pointer"
            exit 1
          fi
          echo "zstd OK"

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Prepare Host Dependencies
        run: |
          set -o pipefail
          sudo apt-get update

          # ── Core build tools ──
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config

          # ── Math / compression ──
          sudo apt-get install -y \
            zlib1g-dev libzstd-dev libgmp-dev

          # ── Image formats ──
          sudo apt-get install -y \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev libopenjp2-7-dev

          # ── OpenEXR / Imath (core deps for OIIO) ──
          sudo apt-get install -y libopenexr-dev libimath-dev

          # ── OpenImageIO (REQUIRED by platform_unix.cmake) ──
          sudo apt-get install -y libopenimageio-dev openimageio-tools

          # ── OpenColorIO (REQUIRED by platform_unix.cmake) ──
          sudo apt-get install -y libopencolorio-dev

          # ── OpenCV headers (OIIO cmake config references /usr/include/opencv4) ──
          sudo apt-get install -y libopencv-dev

          # ── GL / Vulkan / Epoxy ──
          sudo apt-get install -y \
            libepoxy-dev libgl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers

          # ── Fonts / text ──
          sudo apt-get install -y \
            libfreetype-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libbrotli-dev

          # ── C++ formatting ──
          sudo apt-get install -y libfmt-dev

          # ── Audio ──
          sudo apt-get install -y libopenal-dev libsndfile1-dev

          # ── FFmpeg (host_tools needs x86_64 libs for audaspace) ──
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev

          # ── Shader compiler ──
          sudo apt-get install -y libshaderc-dev

          # ── Threading / compute ──
          sudo apt-get install -y libtbb-dev

          # ── Python ──
          sudo apt-get install -y python3-dev

          # ── Math / scientific ──
          sudo apt-get install -y \
            libeigen3-dev libceres-dev libfftw3-dev

          # ── Geometry / mesh ──
          sudo apt-get install -y libembree-dev

          # ── PugiXML ──
          sudo apt-get install -y libpugixml-dev

          # ── Rubberband ──
          sudo apt-get install -y librubberband-dev

          # ── Draco ──
          sudo apt-get install -y libdraco-dev

          # ── Meshoptimizer ──
          sudo apt-get install -y libmeshoptimizer-dev

          # ── GCC 14 ──
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

          echo "=== gcc ===" && gcc --version | head -1
          echo "=== g++ ===" && g++ --version | head -1

          # ── Verify critical packages ──
          echo ""
          echo "=== Verifying critical packages ==="
          for pkg in libopenimageio-dev libopencolorio-dev libopencv-dev libembree-dev libeigen3-dev libceres-dev; do
            if dpkg -s "$pkg" 2>/dev/null | grep -q "Status: install ok installed"; then
              echo "  OK: $pkg"
            else
              echo "  FAIL: $pkg NOT installed"
              exit 1
            fi
          done

          # ── Fix broken OCIO cmake config: references "/include" which doesn't exist ──
          # Ubuntu's libopencolorio-dev has a broken INTERFACE_INCLUDE_DIRECTORIES="/include"
          OCIO_CONFIG=$(find /usr -name "OpenColorIOConfig.cmake" 2>/dev/null | head -1)
          if [ -n "$OCIO_CONFIG" ]; then
            echo "OpenColorIO config: $OCIO_CONFIG"
            # Fix broken /include path
            if grep -q '"/include"' "$OCIO_CONFIG" 2>/dev/null; then
              echo "Fixing broken /include path in OpenColorIO config..."
              sudo sed -i 's|"/include"|"/usr/include"|g' "$OCIO_CONFIG"
            fi
            # Ensure cmake can find it at standard path: <prefix>/cmake/OpenColorIO/OpenColorIOConfig.cmake
            OCIO_CMAKE_DIR=$(dirname "$OCIO_CONFIG")
            STANDARD_DIR="/usr/share/cmake/OpenColorIO"
            if [ "$OCIO_CMAKE_DIR" != "$STANDARD_DIR" ]; then
              echo "Creating standard cmake path for OpenColorIO: $STANDARD_DIR"
              sudo mkdir -p "$STANDARD_DIR"
              sudo ln -sf "$OCIO_CONFIG" "$STANDARD_DIR/"
              # Also link version file if it exists
              VERSION_FILE=$(find /usr -name "OpenColorIOConfigVersion.cmake" 2>/dev/null | head -1)
              [ -n "$VERSION_FILE" ] && sudo ln -sf "$VERSION_FILE" "$STANDARD_DIR/"
              # Also link Targets files
              for f in $(find /usr -name "OpenColorIOTargets*.cmake" 2>/dev/null); do
                sudo ln -sf "$f" "$STANDARD_DIR/"
              done
            fi
          fi

          # Verify host_tools can find OIIO/OCIO from system
          echo ""
          echo "=== Final verification ==="
          echo "OIIO config (should be at standard cmake path):"
          find /usr/lib -path "*/cmake/OpenImageIO/OpenImageIOConfig.cmake" 2>/dev/null | head -1
          echo "OCIO config (should be at standard cmake path):"
          ls -la /usr/share/cmake/OpenColorIO/OpenColorIOConfig.cmake 2>/dev/null || echo "NOT FOUND"
          echo ""

          # ── Locate cmake config files ──
          echo ""
          echo "=== Locating cmake configs ==="
          echo "OpenImageIO:"
          find /usr -name "OpenImageIOConfig.cmake" 2>/dev/null | head -3
          echo "OpenColorIO:"
          find /usr -name "OpenColorIOConfig.cmake" 2>/dev/null | head -3
          echo "Embree:"
          find /usr -name "embree-config.cmake" -o -name "EmbreeConfig.cmake" 2>/dev/null | head -3
          echo ""

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python 3.13
        run: |
          which python3 && python3 --version
          echo "Python path: $(which python3)"

      - name: Configure CMake (attempt 1)
        id: cmake-attempt1
        run: |
          set -o pipefail
          cd blender

          cmake -B build \
            -S . \
            -DCMAKE_TOOLCHAIN_FILE=build_files/cmake/platform/platform_android_toolchain.cmake \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -C build_files/cmake/config/blender_release.cmake \
            -DWITH_TESTS=OFF \
            -DWITH_PYTHON_INSTALL=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_GHOST_X11=OFF \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DTEST_PYTHON_EXE=$(which python3) \
            -GNinja 2>&1 | tee cmake_config.log

      - name: Handle CMake failure
        if: steps.cmake-attempt1.outcome == 'failure'
        run: |
          set -o pipefail
          cat cmake_config.log
          exit 1

      - name: Build and stage Gradle
        if: steps.cmake-attempt1.outcome == 'success'
        run: |
          set -o pipefail
          cd blender
          cmake --build build --target install 2>&1 | tee build.log
          cmake --build build --target gradle_stage 2>&1 | tee gradle_stage.log

      - name: Assemble APK
        run: |
          set -o pipefail
          cd blender/build/gradle
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PblenderVersionName=5.2.0 \
            -PblenderVersionCode=5020000 \
            -PblenderMinSdk=29 2>&1 | tee gradle.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find blender/build/gradle -name "app-release.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: cmake_config*.log build.log gradle.log
          if-no-files-found: ignore
