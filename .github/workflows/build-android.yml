name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      libs_android_arm64:
        description: 'Commit of lib-android_arm64 to build against (blank = upstream HEAD)'
        required: false
        default: ''
      libs_linux_x64:
        description: 'Commit of lib-linux_x64 to build against (blank = upstream HEAD)'
        required: false
        default: ''
      android_branch:
        description: 'Branch of blender/blender to build (blank = android)'
        required: false
        default: ''

# The full Blender cross-build (7642 targets) is expensive (~40 min) and only depends on the
# Blender source, the NDK and the precompiled libs. The APK assembly itself is a light Gradle
# step that consumes the staged Gradle project produced by the CMake `gradle_stage` target.
#
# To avoid recompiling every Blender target when only the final APK step fails, the pipeline is
# split in two jobs:
#   - `build`: CMake configure, full build, install, `gradle_stage`. Publishes the staged Gradle
#     project as a `gradle-stage` artifact.
#   - `assemble`: Downloads the artifact, restores Gradle caches and runs `gradlew assembleRelease`.
#     A failure here only re-runs this job (no Blender recompile).
#
# NOTE on Git LFS: the repo tracks release/datafiles, assets, release/android icons and the
# `gradle-wrapper.jar` through Git LFS (see .gitattributes `*.jar filter=lfs`). When checked out
# with `lfs: false`, those files end up as ~130 byte pointer stubs. Neither the GitHub mirror raw
# endpoint nor `raw.githubusercontent.com` serves the real objects (the GitHub LFS store 404s and
# raw returns the pointer), which is why the final APK step previously failed with
# `Could not find or load main class org.gradle.wrapper.GradleWrapperMain` (empty wrapper JAR).
# The real LFS objects are served anonymously from the official Blender Gitea repository
# (`projects.blender.org`), so we fetch the subset required for the Android build from there
# using the official `git lfs` mechanism, then verify a few critical files by SHA-256.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (android branch, no LFS)
        id: checkout
        uses: actions/checkout@v4
        with:
          path: blender
          # Upstream blender/blender's own android branch. Overridable so the same
          # workflow, the same prebuilt libs and the same everything else can be pointed
          # at a different source commit -- that is the only way to tell a source
          # regression from a toolchain or dependency one.
          ref: ${{ inputs.android_branch || 'android' }}
          lfs: false

      - name: Resolve required Git LFS files from the official Blender repository
        run: |
          set -o pipefail
          cd blender
          git lfs install --local
          git remote add upstream-lfs https://projects.blender.org/blender/blender.git
          # Only the files needed by the Android build/runtime. The `install` target copies
          # release/datafiles and assets into the portable runtime directory; release/android
          # contains the Gradle skeleton (incl. gradle-wrapper.jar and the webp launcher icons).
          # tests/, release/windows, release/darwin and doc/ are not needed.
          INCLUDE="release/android/**,release/datafiles/**,assets/**,scripts/startup/**"
          git lfs fetch upstream-lfs --include "$INCLUDE"
          git lfs pull --include "$INCLUDE"
          echo "LFS files resolved."

      - name: Verify resolved LFS files (gradle wrapper, launcher icons, startup.blend)
        run: |
          set -o pipefail
          cd blender
          JAR=release/android/gradle/wrapper/gradle-wrapper.jar
          SZ=$(stat -c%s "$JAR")
          echo "gradle-wrapper.jar size: $SZ (expected 54213, a stub is 130)"
          [ "$SZ" = "54213" ] || { echo "ERROR: gradle-wrapper.jar is still an LFS stub"; exit 1; }
          HASH=$(sha256sum "$JAR" | awk '{print $1}')
          echo "gradle-wrapper.jar sha256: $HASH"
          [ "$HASH" = "2c23278a62dc9f96ab11bee897d9f53e6479d6419135e4560ce822a6431df5e5" ] \
            || { echo "ERROR: gradle-wrapper.jar sha256 mismatch"; exit 1; }
          python3 -c "import zipfile; z=zipfile.ZipFile('$JAR'); assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist(); print('GradleWrapperMain.class present')"
          # Launcher icons are referenced by the manifest; aapt2 fails on pointer stubs.
          for f in $(git ls-files 'release/android/app/src/main/res/mipmap-*/ic_launcher*.webp'); do
            MAGIC=$(head -c4 "$f" | od -An -tx1 | tr -d ' \n')
            [ "$MAGIC" = "52494646" ] || { echo "ERROR: $f is still a stub (magic=$MAGIC)"; exit 1; }
          done
          echo "Launcher icons OK (RIFF/webp)."
          SIZE_SB=$(stat -c%s release/datafiles/startup.blend)
          echo "startup.blend size: $SIZE_SB (real content, not a dummy)"
          [ "$SIZE_SB" -gt 1024 ] || { echo "ERROR: startup.blend is empty/stub"; exit 1; }
          echo "=== remaining git modifications (should be empty) ==="
          git status --short | head -20
          echo "Required LFS files verified OK."

      - name: Resolve precompiled libs commit IDs
        id: libs-commit
        run: |
          # PINNED, not HEAD. Resolving the precompiled libraries at HEAD means the .so
          # is a function of when the run happened: the same commit of `android` produces a
          # different binary every time the upstream lib repos move. That is what makes a
          # regression impossible to bisect -- if a build starts crashing, the source did
          # not necessarily change. Override with workflow_dispatch inputs to bisect.
          set -o pipefail
          ARM_PIN="${{ inputs.libs_android_arm64 }}"
          X64_PIN="${{ inputs.libs_linux_x64 }}"
          if [ -z "$ARM_PIN" ]; then
            ARM_PIN=$(git ls-remote https://projects.blender.org/blender/lib-android_arm64.git HEAD | cut -f1)
          fi
          if [ -z "$X64_PIN" ]; then
            X64_PIN=$(git ls-remote https://projects.blender.org/blender/lib-linux_x64.git HEAD | cut -f1)
          fi
          echo "arm=$ARM_PIN" >> $GITHUB_OUTPUT
          echo "x64=$X64_PIN" >> $GITHUB_OUTPUT
          # The checked-out source commit, not github.sha: github.sha is the commit of the
          # branch that carries this workflow, so it moves every time the yml is edited and
          # would throw the build tree away on each fix. What the tree depends on is the
          # source it was configured from.
          echo "src=$(git -C blender rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Pinned lib-android_arm64 = $ARM_PIN"
          echo "Pinned lib-linux_x64    = $X64_PIN"
          echo "Source commit           = $(git -C blender rev-parse HEAD)"

      - uses: actions/cache/restore@v4
        id: cache-libs-android
        with:
          path: blender/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/restore@v4
        id: cache-libs-x64
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      - name: Clone precompiled libs (Android ARM64 — target build)
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        env:
          LIB_COMMIT: ${{ steps.libs-commit.outputs.arm }}
        run: |
          set -o pipefail
          # --depth 1 without a rev clones HEAD, which is not the pinned commit. Fetch the
          # pinned one explicitly, otherwise the pin only decorates the cache key and the
          # build still silently follows upstream.
          git init -q blender/lib/android_arm64
          cd blender/lib/android_arm64
          git remote add origin https://projects.blender.org/blender/lib-android_arm64.git
          git fetch -q --depth 1 origin "$LIB_COMMIT"
          git checkout -q FETCH_HEAD
          echo "lib-android_arm64 at $(git rev-parse HEAD)  (wanted $LIB_COMMIT)"
          git lfs install
          git lfs pull

      - name: Clone precompiled libs (Linux x64 — host_tools)
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        env:
          LIB_COMMIT: ${{ steps.libs-commit.outputs.x64 }}
        run: |
          set -o pipefail
          git init -q blender/lib/linux_x64
          cd blender/lib/linux_x64
          git remote add origin https://projects.blender.org/blender/lib-linux_x64.git
          git fetch -q --depth 1 origin "$LIB_COMMIT"
          git checkout -q FETCH_HEAD
          echo "lib-linux_x64 at $(git rev-parse HEAD)  (wanted $LIB_COMMIT)"
          git lfs install
          git lfs pull

      - uses: actions/cache/save@v4
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        with:
          path: blender/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/save@v4
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      - name: Verify libs
        run: |
          set -o pipefail
          SIZE_ARM=$(stat -c%s blender/lib/android_arm64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "ARM64 zstd.a: $SIZE_ARM bytes"
          SIZE_X64=$(stat -c%s blender/lib/linux_x64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "x64 zstd.a: $SIZE_X64 bytes"
          if [ "$SIZE_ARM" -lt 1000 ] || [ "$SIZE_X64" -lt 1000 ]; then
            echo "ERROR: LFS pointer not resolved"
            exit 1
          fi
          echo "Both libs OK"

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30-beta1
          link-to-sdk: true

      - name: Verify NDK and Vulkan Headers
        run: |
          set -o pipefail
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "========================================"
          echo "1. ANDROID_NDK_ROOT: $NDK_PATH"
          echo "Output ndk-full-version: ${{ steps.setup-ndk.outputs.ndk-full-version }}"
          echo "========================================"
          echo "2. NDK source.properties:"
          cat "$NDK_PATH/source.properties"
          echo "========================================"
          echo "3. Clang version:"
          CLANG_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [ -x "$CLANG_BIN" ]; then
            "$CLANG_BIN" --version
          else
            echo "Clang binary not found at standard path, searching..."
            find "$NDK_PATH" -name "clang" -type f
          fi
          echo "========================================"
          echo "4. vulkan_core.h path and version:"
          VK_HEADER="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan_core.h"
          echo "vulkan_core.h path: $VK_HEADER"
          if [ -f "$VK_HEADER" ]; then
            echo "VK_HEADER_VERSION:"
            grep "#define VK_HEADER_VERSION " "$VK_HEADER"
            echo "========================================"
            echo "5. Checking required Vulkan features:"
            grep -Hn "VkPhysicalDeviceDynamicRenderingUnusedAttachmentsFeaturesEXT" "$VK_HEADER"
            grep -Hn "VkPhysicalDeviceDynamicRenderingLocalReadFeaturesKHR" "$VK_HEADER"
            grep -Hn "VK_EXT_DYNAMIC_RENDERING_UNUSED_ATTACHMENTS_EXTENSION_NAME" "$VK_HEADER"
            grep -Hn "VK_KHR_DYNAMIC_RENDERING_LOCAL_READ_EXTENSION_NAME" "$VK_HEADER"
            echo "Vulkan types and extensions check PASSED."
          else
            echo "ERROR: vulkan_core.h not found at $VK_HEADER"
            exit 1
          fi
          echo "========================================"

      - name: Install host build tools
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config python3-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          gcc --version | head -1
          g++ --version | head -1

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-blender-android
          max-size: 4G

      # Incremental builds. The key is the exact source commit plus both library commits, and
      # there are deliberately NO restore-keys: a prefix match is what let a tree from one
      # revision land on top of another and stop cmake reconfiguring. An exact key either
      # hits the tree this commit needs or misses and configures from scratch.
      - name: Restore ninja build tree
        id: cache-builddir
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: blender/build
          key: builddir-${{ runner.os }}-${{ steps.libs-commit.outputs.src }}-a${{ steps.libs-commit.outputs.arm }}-x${{ steps.libs-commit.outputs.x64 }}
          enableCrossOsArchive: false

      # Saved even when a later step fails: a tree that got as far as linking is worth far
      # more on the retry than a clean one is. Keyed identically, so a rerun of the same
      # commit restores it.
      - name: Save ninja build tree
        if: always() && steps.cache-builddir.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: blender/build
          key: builddir-${{ runner.os }}-${{ steps.libs-commit.outputs.src }}-a${{ steps.libs-commit.outputs.arm }}-x${{ steps.libs-commit.outputs.x64 }}

      - name: Configure CMake
        id: cmake-attempt1
        run: |
          set -o pipefail
          cd blender
          # WITH_DOC_MANPAGE=OFF, and not because the man page is unwanted: on Android the
          # `blender` target is add_library(blender SHARED), so install/blender is a library
          # and cannot be executed. source/creator/CMakeLists.txt generates the man page by
          # running the installed binary with --help, under a guard of UNIX AND NOT APPLE
          # that Android satisfies, so the install step dies at the very end of an otherwise
          # complete build:
          #   [7/8] Linking CXX shared library lib/libblender.so
          #   FileNotFoundError: ... '/install/blender'
          # The library is already built and linked by then, so this costs nothing.
          #
          # Keep the explanation here and not inline in the command below: a '#' comment
          # between two backslash-continued lines eats the trailing backslash, the command
          # breaks in half, and the next flag runs as its own program:
          #   line 24: -DWITH_DOC_MANPAGE=OFF: command not found
          cmake -B build \
            -S . \
            -DTARGET_ANDROID=ON \
            -DCMAKE_TOOLCHAIN_FILE=build_files/cmake/platform/platform_android_toolchain.cmake \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_INSTALL_PREFIX=install \
            -C build_files/cmake/config/blender_release.cmake \
            -DWITH_TESTS=OFF \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_COMPILER_CCACHE=ON \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_GHOST_X11=OFF \
            -DWITH_DOC_MANPAGE=OFF \
            -DPYTHON_VERSION=3.13 \
            -DPYTHON_EXECUTABLE=$(which python3) \
            -DTEST_PYTHON_EXE=$(which python3) \
            -GNinja 2>&1 | tee cmake_config.log

      - name: Handle CMake failure
        if: steps.cmake-attempt1.outcome == 'failure'
        run: |
          cat cmake_config.log
          exit 1

      - name: Build and stage Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        run: |
          set -o pipefail
          cd blender
          cmake --build build --target install 2>&1 | tee build.log
          cmake --build build --target gradle_stage 2>&1 | tee gradle_stage.log
          # Say which binary this actually produced. libblender.so is what every later
          # conclusion rests on, and "the same commit built a different .so" is the failure
          # mode that makes a regression impossible to bisect.
          SO=build/bin/libblender.so
          test -s "$SO" || { echo "ERROR: $SO missing or empty"; exit 1; }
          echo "=== libblender.so ==="
          ls -l "$SO"
          echo "sha256: $(sha256sum "$SO" | awk '{print $1}')"
          echo "build-id: $(readelf -n "$SO" 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1)"
          echo "source commit: $(git rev-parse HEAD)"
          echo "libs-android_arm64: ${{ steps.libs-commit.outputs.arm }}"
          echo "libs-linux_x64:    ${{ steps.libs-commit.outputs.x64 }}"
          # ANativeActivity_onCreate is what NativeActivity.onCreate dlsym()s out of the
          # library. With the SDL path it comes from libSDL3.so, so this is informational
          # rather than fatal -- but a build that silently stopped exporting it is exactly
          # how the 'undefined symbol' APK happened.
          if readelf --dyn-syms -W "$SO" | grep -q ANativeActivity_onCreate; then
            echo "libblender.so exports ANativeActivity_onCreate"
          else
            echo "::warning::libblender.so does not export ANativeActivity_onCreate"
            echo "::warning::(expected on the SDL path: libSDL3.so provides it)"
          fi

      - name: Package staged Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        run: |
          set -o pipefail
          cd blender/build/gradle
          # The staged project embeds machine-specific settings from the build job runner, and
          # Gradle intermediates that the `assemble` job must regenerate.
          rm -f local.properties
          cd ..
          tar -I 'zstd -T0' -cf ../gradle-stage.tar.zst \
            --exclude='gradle/**/.gradle' \
            --exclude='gradle/app/build' \
            gradle
          echo "Staged size: $(du -sh ../gradle-stage.tar.zst | awk '{print $1}')"

      - name: Upload staged Gradle project
        if: steps.cmake-attempt1.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gradle-stage
          path: blender/gradle-stage.tar.zst
          retention-days: 7
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/cmake_config*.log
            blender/build.log
            blender/gradle_stage.log
            *.log
          if-no-files-found: ignore

  assemble:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download staged Gradle project
        uses: actions/download-artifact@v4
        with:
          name: gradle-stage

      - name: Extract staged Gradle project
        run: |
          set -o pipefail
          # download-artifact@v4 unzips the artifact contents directly into $GITHUB_WORKSPACE
          # (no subfolder for single artifacts), so the tarball lands in the workspace root.
          ls -la
          mkdir -p stage
          tar -I zstd -xf gradle-stage.tar.zst -C stage
          chmod +x stage/gradle/gradlew
          echo "Staged layout:"
          ls stage/gradle

      - name: Verify Gradle wrapper integrity in the staged project
        run: |
          set -o pipefail
          JAR=stage/gradle/gradle/wrapper/gradle-wrapper.jar
          SZ=$(stat -c%s "$JAR")
          echo "gradle-wrapper.jar size: $SZ (expected 54213)"
          [ "$SZ" = "54213" ] || { echo "ERROR: gradle-wrapper.jar is an LFS stub"; exit 1; }
          python3 -c "import zipfile; z=zipfile.ZipFile('$JAR'); assert 'org/gradle/wrapper/GradleWrapperMain.class' in z.namelist(); print('GradleWrapperMain.class present')"
          echo "Gradle wrapper OK"
          echo "--- gradle-wrapper.properties ---"
          cat stage/gradle/gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle Wrapper distributions
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          # The distribution version is pinned in gradle-wrapper.properties (Gradle 9.4.1).
          key: gradle-wrapper-${{ hashFiles('stage/gradle/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          # Keyed on the pinned Gradle + AGP configuration so incompatible dependency sets are
          # never reused (exact key only, no restore-key fallback). AGP is pinned to 9.2.0 in
          # build.gradle and the wrapper to Gradle 9.4.1.
          key: gradle-caches-${{ hashFiles('stage/gradle/gradle/wrapper/gradle-wrapper.properties','stage/gradle/build.gradle','stage/gradle/settings.gradle','stage/gradle/gradle.properties','stage/gradle/app/build.gradle') }}

      - name: Ensure Android SDK build platform is available
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "platforms;android-36 present"
          else
            echo "platforms;android-36 missing — installing (licenses are pre-accepted on runners)"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ -x "$SDKM" ]; then
              yes | "$SDKM" "platforms;android-36"
            else
              echo "sdkmanager not found; letting AGP auto-download instead"
            fi
          fi

      - name: Assemble APK
        run: |
          set -o pipefail
          cd stage/gradle
          # app/build.gradle reads every one of these with project.property(), which THROWS
          # when the property is absent -- there is no default to fall back on. blenderAbi
          # was missing from this invocation, so the run reached Gradle and died during
          # configuration, after the native build had already spent its time:
          #   Could not get unknown property 'blenderAbi' for project ':app'
          #   Build file '.../stage/gradle/app/build.gradle' line: 34
          # Upstream's own gradle_assemble target passes all four
          # (build_files/cmake/platform/platform_android_gradle.cmake, gradle_assemble):
          #   -PblenderVersionName -PblenderVersionCode -PblenderMinSdk -PblenderAbi
          # Take the ABI from the libraries that were actually staged (platform_android_stage.cmake
          # writes them to app/src/main/jniLibs/<abi>/) so a non-arm64 build can never be
          # mislabelled as arm64-v8a.
          ABI=$(find app/src/main/jniLibs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | head -1)
          [ -n "$ABI" ] || ABI=arm64-v8a
          ARGS=(
            "-PblenderVersionName=5.3.0 Alpha"
            "-PblenderVersionCode=5030001"
            "-PblenderMinSdk=29"
            "-PblenderAbi=$ABI"
          )
          # Fail here, naming the property Gradle wanted, instead of inside its configuration
          # phase. Cheap: this runs before anything is compiled.
          MISSING=""
          for p in $(grep -oE "project\.property\('[A-Za-z]+'\)" app/build.gradle \
                       | sed "s/.*'\(.*\)'.*/\1/" | sort -u); do
            found=0
            for a in "${ARGS[@]}"; do case "$a" in "-P$p="*) found=1 ;; esac; done
            [ "$found" = 1 ] || MISSING="$MISSING $p"
          done
          [ -z "$MISSING" ] || { echo "ERROR: app/build.gradle needs$MISSING but they were not passed"; exit 1; }
          echo "ABI: $ABI"
          printf 'Gradle args:'; printf ' %q' "${ARGS[@]}"; echo
          ./gradlew assembleRelease "${ARGS[@]}" 2>&1 | tee gradle.log

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find stage/gradle -name "app-release.apk" 2>/dev/null | head -1)
          echo "apk_path=$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: ${{ steps.find-apk.outputs.apk_path }}

      - name: Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            stage/gradle/gradle.log
            gradle-stage.tar.zst
          if-no-files-found: ignore